<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#170b26"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .row { opacity: 0; animation: row .6s ease-out forwards; }
      @keyframes row { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .k { fill: #64748b; font-size: 13px; }
      .v { fill: #e2e8f0; font-size: 16px; }
      .big { font-size: 34px; font-weight: 300; }
      .cap { fill: #94a3b8; font-size: 12.5px; }
      .cursor { animation: c 1s steps(1) infinite; }
      @keyframes c { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="16" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".25"/>
  <circle cx="28" cy="26" r="5" fill="#ff5f57" fill-opacity=".8"/><circle cx="46" cy="26" r="5" fill="#febc2e" fill-opacity=".8"/><circle cx="64" cy="26" r="5" fill="#28c840" fill-opacity=".8"/>
  <text class="mono" x="500" y="31" text-anchor="middle" font-size="12" fill="#64748b">~/whoami</text>
  <line x1="1" y1="48" x2="999" y2="48" stroke="#a78bfa" stroke-opacity=".15"/>

  <g class="mono">
    <g class="row" style="animation-delay:.2s"><text class="k" x="44" y="96">now</text><text class="v sans" x="150" y="96">AI/ML intern @ C-DOT — computer vision on live camera feeds</text></g>
    <g class="row" style="animation-delay:.45s"><text class="k" x="44" y="136">before</text><text class="v sans" x="150" y="136">SWE intern @ Adobe — on-device small language models</text></g>
    <g class="row" style="animation-delay:.7s"><text class="k" x="44" y="176">studying</text><text class="v sans" x="150" y="176">B.Tech CSE · Banasthali</text></g>
    <g class="row" style="animation-delay:.95s"><text class="k" x="44" y="216">into</text><text class="v sans" x="150" y="216">small fast models, backend, things that just work</text></g>
    <g class="row" style="animation-delay:1.2s"><text class="k" x="44" y="256">status</text><text class="v sans" x="150" y="256" fill="#f0abfc">probably debugging something<tspan class="cursor">_</tspan></text></g>
  </g>

  <line x1="720" y1="76" x2="720" y2="266" stroke="#a78bfa" stroke-opacity=".15"/>
  <g class="sans">
    <g class="row" style="animation-delay:1.5s"><text class="big" x="760" y="112" fill="#f0abfc">84%</text><text class="cap" x="760" y="132">lower latency, adobe slm</text></g>
    <g class="row" style="animation-delay:1.7s"><text class="big" x="760" y="182" fill="#c4b5fd">67%</text><text class="cap" x="760" y="202">smaller model, same quality</text></g>
    <g class="row" style="animation-delay:1.9s"><text class="big" x="760" y="252" fill="#67e8f9">1</text><text class="cap" x="760" y="272">patent along the way</text></g>
  </g>
</svg>
