<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#140a2b"/><stop offset="100%" stop-color="#25092f"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .arrow { animation: nudge 1.2s ease-in-out infinite; }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
      .load { transform-box: fill-box; transform-origin: left; animation: load 5s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes load { 0% { transform: scaleX(0); } 80%,100% { transform: scaleX(1); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .sp { animation: sp 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes sp { 0%,100% { opacity: .2; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
    </style>
  </defs>
  <rect width="1000" height="150" rx="18" fill="url(#bg)"/>
  <g fill="#f0abfc">
    <path class="sp" d="M60 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path class="sp" d="M940 50 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" style="animation-delay:.8s"/>
    <path class="sp" d="M880 130 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" style="animation-delay:1.6s"/>
    <path class="sp" d="M120 128 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" style="animation-delay:1.2s"/>
  </g>

  <text class="sans" x="500" y="78" text-anchor="middle" font-size="22" font-weight="600" fill="#e2e8f0">that's about it.</text>
  <text class="mono" x="500" y="110" text-anchor="middle" font-size="13" fill="#a5b4fc">thanks for stopping by ✦ <tspan class="blink" fill="#f0abfc">_</tspan></text>
</svg>
